name: Crear build y pushear en otra rama

on:
  push:
    branches:
      - main # La rama en la que realizas los cambios

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install all dependencies
        run: yarn install

      - name: Build
        run: yarn build # Ejecutar el comando de build con yarn

      - name: Push built assets to build branch
        uses: s0/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: build # La rama donde se suben los archivos compilados
          FOLDER: dist # La carpeta donde se generan los assets (cambia si el build genera en otro lugar)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub automáticamente añade el token
          MESSAGE: "Build: ({sha}) {msg}" # El mensaje de commit